spring:
  profiles:
    active: dev
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claim}
      username: ${DB_USER:app_user}
      password: ${DB_PASSWORD:claim}
  flyway:
    enabled: false

app:
  datasource:
    migration:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claim}
      username: ${MIGRATION_DB_USER:app_migrator}
      password: ${MIGRATION_DB_PASSWORD:claim}
      maximum-pool-size: 2

management:
  endpoints:
    web:
      exposure:
        include: health
