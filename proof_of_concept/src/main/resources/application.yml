spring:
  profiles:
    active: dev
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claim}
      username: ${DB_USER:app_user}
      password: ${DB_PASSWORD:claim}
  flyway:
    enabled: false

app:
  datasource:
    migration:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claim}
      username: ${FLYWAY_USER:app_migrator}
      password: ${FLYWAY_PASSWORD:claim}
      maximum-pool-size: 2

logging:
  level:
    ee.claimai: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.jdbc: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
