spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claim}
    username: ${DB_USER:claim}
    password: ${DB_PASSWORD:claim}
  flyway:
    enabled: true
    schemas: public
jwt:
  secret: poc-secret-key-change-me-to-a-very-long-value-at-least-32-bytes
  expiration-hours: 8
management:
  endpoints:
    web:
      exposure:
        include: health
