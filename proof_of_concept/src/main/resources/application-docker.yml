spring:
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://postgres:5432/claim

app:
  datasource:
    migration:
      jdbc-url: jdbc:postgresql://postgres:5432/claim
      username: ${FLYWAY_USER:claim}
      password: ${FLYWAY_PASSWORD:claim}
  encryption:
    local:
      kek-hex: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  security:
    secure-cookie: false

jwt:
  secret: ${JWT_SECRET:poc-secret-key-change-me-to-a-very-long-value-at-least-32-bytes}
  expiration-hours: 8
