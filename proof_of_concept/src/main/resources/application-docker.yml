spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/claim
  flyway:
    url: jdbc:postgresql://postgres:5432/claim
    locations: classpath:db/migration,classpath:db/seed
jwt:
  secret: ${JWT_SECRET:poc-secret-key-change-me-to-a-very-long-value-at-least-32-bytes}
  expiration-hours: 8
app:
  security:
    secure-cookie: false
