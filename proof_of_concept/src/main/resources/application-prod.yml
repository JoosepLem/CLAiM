spring:
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:claim}

app:
  datasource:
    migration:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:claim}
  security:
    secure-cookie: true
  encryption:
    kms:
      key-id: ${KMS_KEY_ID}
      region: ${KMS_REGION:eu-north-1}

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:8}
