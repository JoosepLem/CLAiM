services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claim}
      POSTGRES_DB: ${POSTGRES_DB:-claim}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claim} -d ${POSTGRES_DB:-claim}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /tmp/claim-initdb:/docker-entrypoint-initdb.d

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-claim}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_user_pass}
      FLYWAY_USER: ${FLYWAY_USER:-app_migrator}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-app_migrator_pass}

volumes:
  pgdata:
